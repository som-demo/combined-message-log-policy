name: Publish Omni Gateway policy
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-publish:
    runs-on: ubuntu-latest
    environment: anypoint-prod          # remove if not using environments
    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      ANYPOINT_ORG: ${{ secrets.ANYPOINT_ORG_ID }}
    # defaults:
    #   run:
    #     working-directory: my-custom-policy   # uncomment if Makefile is in a subfolder
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install Anypoint CLI + PDK plugin
        run: |
          npm install -g anypoint-cli-v4
          anypoint-cli-v4 plugins:install anypoint-cli-pdk-plugin
          anypoint-cli-v4 --version

      - name: Setup (installs cargo-anypoint)
        run: make setup

      - name: Verify tools
        run: |
          which anypoint-cli-v4
          cargo anypoint --help | head -5

      - name: Build
        run: make build

      - name: Publish
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: make publish

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: make release
