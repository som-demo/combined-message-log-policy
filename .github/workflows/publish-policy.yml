name: Publish Omni Gateway policy
on:
  workflow_dispatch:
    inputs:
      client_id:
        description: 'Anypoint Connected App client ID'
        required: true
      client_secret:
        description: 'Anypoint Connected App client secret'
        required: true
      org_id:
        description: 'Anypoint org ID'
        required: true
      mode:
        description: 'publish (dev) or release'
        type: choice
        options: [publish, release]
        default: publish

jobs:
  build-publish:
    runs-on: ubuntu-latest
    # defaults:
    #   run:
    #     working-directory: my-custom-policy   # uncomment if Makefile is in a subfolder
    steps:
      - name: Mask and export credentials
        run: |
          CID=$(jq -r '.inputs.client_id' "$GITHUB_EVENT_PATH")
          SECRET=$(jq -r '.inputs.client_secret' "$GITHUB_EVENT_PATH")
          ORG=$(jq -r '.inputs.org_id' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$CID"
          echo "::add-mask::$SECRET"
          echo "::add-mask::$ORG"
          echo "ANYPOINT_CLIENT_ID=$CID" >> "$GITHUB_ENV"
          echo "ANYPOINT_CLIENT_SECRET=$SECRET" >> "$GITHUB_ENV"
          echo "ANYPOINT_ORG=$ORG" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install Anypoint CLI + PDK plugin
        run: |
          npm install -g anypoint-cli-v4
          anypoint-cli-v4 plugins:install anypoint-cli-pdk-plugin
          anypoint-cli-v4 --version

      - name: Setup (installs cargo-anypoint)
        run: make setup

      - name: Verify tools
        run: |
          which anypoint-cli-v4
          cargo anypoint --help | head -5

      - name: Build
        run: make build

      - name: Publish or release
        run: make ${{ inputs.mode }}
